<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hey Tablo Ep.40 영어 노트</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column; sticky control bar; numbered transcript lines; notes tab pulls examples from the script */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --fg:#1C1F23; --muted:#727982; --line:#DDE0DB;
  --accent:#2C47B0; --marker:#F3D664; --marker-soft:rgba(243,214,100,.55);
  --serif:"Source Serif 4", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Georgia, serif; /* 한글은 본문과 같은 Noto Sans KR로 */
  --sans:"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141619; --surface:#1C1F23; --fg:#E7E8E4; --muted:#8D949C; --line:#2C3036;
  --accent:#93A8FF; --marker:#B79A2A; --marker-soft:rgba(183,154,42,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141619; --surface:#1C1F23; --fg:#E7E8E4; --muted:#8D949C; --line:#2C3036;
  --accent:#93A8FF; --marker:#B79A2A; --marker-soft:rgba(183,154,42,.45); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 80px}

header.hero{display:grid;gap:10px;padding-block:22px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,6vw,42px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:400;background:linear-gradient(transparent 58%,var(--marker-soft) 58%)}
.sub{color:var(--muted);margin:0;font-size:14px}
.sub a{color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:600}

.dock{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.player{display:none;padding-top:14px}
.dock.has-player .player{display:block}
.player-box{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;max-height:34vh;margin-inline:auto;background:#000;border-radius:10px;overflow:hidden}
.player-box iframe,.player-box>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.follow{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 11px;border-radius:999px;cursor:pointer;display:none;align-items:center;gap:6px}
.dock.has-player .follow{display:flex}
.follow[aria-pressed="true"]{color:var(--fg)}
.follow[aria-pressed="true"] .dot{background:var(--accent);border-color:var(--accent)}
.follow .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}
.ctrls{display:flex;gap:6px;flex-wrap:wrap}
.bar{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
  padding-block:12px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{font:inherit;font-size:13.5px;font-weight:500;border:0;background:transparent;color:var(--muted);padding:7px 15px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.toggle{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 13px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px}
.toggle .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.toggle[hidden]{display:none}
.toggle[aria-pressed="true"] .dot{background:var(--accent);border-color:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.toc{display:flex;flex-wrap:wrap;gap:6px;padding-block:14px 4px}
.toc a{font-size:12.5px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:3px 10px;border-radius:999px;background:var(--surface)}
#notes .toc{position:sticky;top:var(--dock-h,0px);z-index:4;background:var(--bg);padding-block:10px 8px}
.toc a:hover{color:var(--fg);border-color:var(--muted)}

section.ch{padding-top:30px;scroll-margin-top:70px}
.ch-head{display:grid;gap:2px;margin-bottom:10px}
.ch-num{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--accent)}
.ch-head h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0;line-height:1.25;text-wrap:balance}
.ch-head p{margin:0;font-size:13px;color:var(--muted)}
/* 챕터 구간 반복 버튼 (list.js에서 loop:true인 영상만, 유튜브 플레이어가 준비된 뒤에만 보임) */
.ch-head{position:relative}
.ch-head.has-loop{padding-right:96px}
.ch-loop{display:none;position:absolute;top:0;right:0;align-items:center;gap:5px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.ch-loop svg{width:14px;height:14px}
body.yt-ready .ch-loop{display:inline-flex}
.ch-loop[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.ch-head p.ch-d{margin-top:6px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--fg);font-size:13px;line-height:1.55;max-width:62ch}

.line{display:grid;grid-template-columns:38px 1fr;gap:0 10px;padding-block:11px;border-bottom:1px dashed var(--line);scroll-margin-top:80px}
.line.flash,.ex.flash,.w.flash{animation:flash 1.6s ease-out}
.s-note{font:inherit;font-size:11.5px;font-weight:500;height:22px;padding:0 9px;border:1px solid var(--marker,#e9c84a);border-radius:999px;background:var(--marker-soft);color:var(--fg);cursor:pointer}
.s-note:hover{border-color:var(--fg)}
@keyframes flash{0%{background:var(--marker-soft)}100%{background:transparent}}
.n{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:5px;border:0;background:none;cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.n:hover{color:var(--accent)}
.n::after{content:" ▸";opacity:0}
.n:hover::after{opacity:1}
.en{font-family:var(--serif);font-size:17.5px;line-height:1.55;min-width:0}
.ko{grid-column:2;font-size:14px;color:var(--muted);margin-top:3px;transition:filter .2s;min-width:0}
mark{background:linear-gradient(transparent 60%,var(--marker) 60%);color:inherit;padding:0 1px;font-weight:600}
.t{grid-column:2;justify-self:start;margin-top:6px;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:2px 9px;border-radius:999px;cursor:pointer}
.t:hover{border-color:var(--accent)}
.line.now{background:linear-gradient(90deg,var(--marker-soft),transparent 85%);border-radius:6px}
.line.now .t{background:var(--accent);color:var(--bg);border-color:var(--accent)}
/* expression videos: usage tip + A/B dialogue under the key line, two round chips */
.tip{grid-column:2;font-size:13px;color:var(--muted);margin-top:6px;padding-left:10px;border-left:2px solid var(--marker)}
.dlg{grid-column:2;display:grid;gap:6px;margin-top:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.dl{display:grid;grid-template-columns:26px 1fr;gap:0 8px;align-items:baseline}
.who{grid-row:span 2;font:inherit;font-family:var(--mono);font-size:11px;font-weight:600;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--accent);cursor:pointer;padding:0;align-self:start}
.who:hover{border-color:var(--accent)}
.den{font-family:var(--serif);font-size:15.5px;line-height:1.45;min-width:0}
.dko{font-size:13px;color:var(--muted);transition:filter .2s;min-width:0}
.sb{color:var(--accent);font-weight:400;opacity:.7;padding:0 1px}
.sit{grid-column:2;margin-top:8px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:13.5px;line-height:1.55;min-width:0}
.sit b{display:block;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--accent);margin-bottom:2px}
.ts{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.ts .t{margin-top:0}
/* 한 문장 반복 버튼 (유튜브 플레이어가 준비된 뒤에만 보임) */
.s-loop{display:none;align-items:center;justify-content:center;width:26px;height:22px;padding:0;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--accent);cursor:pointer}
.s-loop svg{width:13px;height:13px}
body.yt-ready .s-loop{display:inline-flex}
.s-loop:hover{border-color:var(--accent)}
.s-loop[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
/* 말 틀: 점선 밑줄, 누르면 말풍선 */
.fr{border-bottom:1.5px dashed var(--muted);cursor:pointer}
body.no-fr .fr{border-bottom:0;cursor:auto}
.fr-tip{position:fixed;z-index:30;max-width:min(320px,calc(100vw - 24px));background:var(--fg);color:var(--bg);padding:9px 12px;border-radius:9px;font-size:13.5px;line-height:1.5;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.fr-tip b{display:block;font-family:var(--sans);font-size:11.5px;font-weight:600;opacity:.7;margin-bottom:2px}
.fr-tip span{display:block;font-size:12.5px;opacity:.8;margin-top:4px}
.fr-tg{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 12px;border-radius:999px;cursor:pointer;margin-bottom:6px}
.fr-tg[aria-pressed="false"]{color:var(--muted)}
/* 구조 해설: 번호 아래 '구조' 버튼 → 문장 아래 펼침 */
.sx{grid-column:1;grid-row:2;justify-self:start;align-self:start;margin-top:3px;font:inherit;font-size:10.5px;line-height:1.4;padding:1px 4px;border:1px solid var(--accent);border-radius:5px;background:none;color:var(--accent);cursor:pointer;white-space:nowrap}
.sx[aria-expanded="true"]{background:var(--accent);color:#fff}
.sxp{grid-column:2;margin-top:10px}
.sxb{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:13.5px;line-height:1.55;min-width:0}
.sxt{display:grid;gap:5px;padding-bottom:10px;margin-bottom:4px;border-bottom:1px dashed var(--line)}
.sxr{padding-left:calc(var(--d)*16px);border-left:2px solid transparent}
.sxr:not([style*="--d:0"]){border-left-color:var(--line);margin-left:2px}
.sxe{font-family:var(--serif);font-size:15px;color:var(--fg)}
.sxn{display:block;font-size:12px;color:var(--muted)}
.sxn.key{color:var(--accent);font-weight:600}
.sxd{margin:0}
.sxd dt{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--accent);margin-top:9px}
.sxd dd{margin:2px 0 0}
.sxc{font-family:var(--serif);font-size:15px}
.sxi{padding-block:14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
/* 번호 아래 '구조'·'해설' 버튼 묶음 */
.side{grid-column:1;grid-row:2;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.side .sx{grid-column:auto;grid-row:auto;margin-top:3px}
/* 해설 노트 */
.xpb{font-size:14px}
.xpt{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--accent);margin-bottom:6px}
.xpb p{margin:6px 0 0}
.xph{font-size:14px;font-weight:600;margin:14px 0 2px;color:var(--fg)}
.xen{font-family:var(--serif);font-size:15px;color:var(--fg)}
.xpb p.xen{margin-top:10px}
.xko{color:var(--muted);font-size:13px;margin-top:1px!important}
/* ☆ 스크랩 버튼 */
.s-scrap{display:inline-flex;align-items:center;justify-content:center;width:26px;height:22px;padding:0;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:13px;line-height:1;cursor:pointer}
.s-scrap:hover{border-color:var(--accent)}
.s-scrap[aria-pressed="true"]{color:#e0a800;border-color:#e0a800}
.sheet-head{gap:8px}.sheet-head h2{margin-right:auto}
.scrap-btn{text-decoration:none;font-size:15px;padding:0 11px;gap:3px}
.scrap-btn b{font-size:12px;font-weight:600;color:var(--muted)}
/* 군말 흐리게: um, uh, like, you know, kind of 등 뉘앙스용 말을 연하게 */
body.fade-fl .fl{opacity:.32}
body.hide-ko .dko{filter:blur(5px);cursor:pointer;user-select:none}
body.hide-ko .dko.peek,body.hide-ko .dl:hover .dko{filter:none}
body.hide-ko .ko{filter:blur(5px);cursor:pointer;user-select:none}
body.hide-ko .ko:hover,body.hide-ko .ko.peek{filter:none}

/* notes */
.notes-sec{padding-top:30px}
.notes-sec h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 4px}
.notes-sec>p{margin:0 0 14px;color:var(--muted);font-size:13px}
.ex{display:grid;gap:4px;padding-block:14px;border-bottom:1px solid var(--line)}
.ex-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ex-p{font-family:var(--serif);font-size:19px;font-weight:600}
.ex-k{font-size:14px;color:var(--fg)}
.ex-tip{font-size:13px;color:var(--muted)}
.ex-src{font-family:var(--serif);font-size:15px;color:var(--fg);padding-left:12px;border-left:2px solid var(--line);margin-top:2px}
.ex-src .ref{font-family:var(--mono);font-size:11px;color:var(--accent);background:none;border:0;cursor:pointer;padding:0 0 0 6px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 22px}
.w{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding-block:9px;border-bottom:1px solid var(--line);min-width:0}
.w-w{font-family:var(--serif);font-size:16.5px;font-weight:600}
.w-pos{font-family:var(--mono);font-size:10.5px;color:var(--muted);align-self:center}
.w-k{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.w-k .ref{font-family:var(--mono);font-size:11px;color:var(--accent);background:none;border:0;cursor:pointer;padding:0 0 0 4px}
body.hide-ko .ex-k,body.hide-ko .w-k{filter:blur(5px)}
body.hide-ko .ex:hover .ex-k,body.hide-ko .w:hover .w-k{filter:none}

footer{margin-top:40px;font-size:12px;color:var(--muted);font-family:var(--mono)}
@media (max-width:480px){.en{font-size:16.5px}.line{grid-template-columns:30px 1fr}}
@media (prefers-reduced-motion:reduce){.line.flash,.ex.flash,.w.flash{animation:none}.ko{transition:none}}
/* video picker: compact pill in the sticky bar (icon only on phones) + overlay sheet, so it never adds a row */
.bar-l{display:flex;align-items:center;gap:6px}
.pick{font:inherit;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;height:37px;min-width:37px;justify-content:center;padding:0 12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;cursor:pointer}
.pick:hover{border-color:var(--muted)}
.pick svg{flex:none}
@media (max-width:600px){.pick{padding:0}.pick-l{display:none}}
/* phones: keep the whole control bar on one row with short labels */
.sm{display:none}
@media (max-width:600px){
  .lg{display:none}.sm{display:inline}
  .bar{flex-wrap:nowrap;gap:4px;padding-block:8px}
  .bar-l{gap:4px;min-width:0}
  .ctrls{flex-wrap:nowrap;gap:4px;flex:none}
  .pick{height:32px;min-width:32px}
  .tabs{padding:2px;gap:2px;flex:none}
  .tab{font-size:12.5px;padding:5px 7px}
  .scrap-btn{padding:0 7px;flex:none}
  .toggle,.follow{font-size:12px;padding:5px 6px;gap:3px;white-space:nowrap}
  .toggle .dot,.follow .dot{width:7px;height:7px}
  .tab{white-space:nowrap}
}
@media (max-width:370px){
  .bar{gap:4px}
  .tab{font-size:12px;padding:5px 8px}
  .toggle,.follow{font-size:11.5px;padding:5px 7px;gap:4px}
}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:min(78vh,640px);background:var(--bg);border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:700px){.sheet-bg{align-items:flex-start;padding-top:9vh}.sheet{border-radius:14px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 4px}
.sheet-head h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0}
.sheet-x{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 12px;cursor:pointer}
.sheet input{margin:8px 16px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);font:inherit;font-size:14px}
.sheet input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chans{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;flex:none}
.chans button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:3px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chans button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.vlist{overflow-y:auto;padding:0 8px 12px;overscroll-behavior:contain}
.vi{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center;width:100%;padding:8px;border:0;background:none;border-radius:10px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.vi:hover{background:var(--surface)}
.vi[aria-current="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.vi-th{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--line)}
.vi-th img{width:100%;height:100%;object-fit:cover;display:block}
.vi-th span{position:absolute;right:3px;bottom:3px;font-family:var(--mono);font-size:10px;color:#fff;background:rgba(0,0,0,.72);padding:0 4px;border-radius:3px}
.vi-t{font-family:var(--serif);font-weight:600;font-size:15px;line-height:1.3;display:block}
.vi-s{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-top:2px}
.vi-p{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.vi-p.on{color:var(--accent)}
.vempty{padding:16px;color:var(--muted);font-size:13.5px;margin:0}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
body.lock{overflow:hidden}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <div class="dock" id="dock">
    <div class="player"><div class="player-box"><div id="yt"></div></div></div>
    <div class="bar">
      <div class="bar-l">
        <button class="pick" id="pick" aria-haspopup="dialog" aria-controls="sheetBg" aria-label="영상 목록 열기">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
          <span class="pick-l" id="pickL">영상 목록</span>
        </button>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-script" aria-selected="true"><span class="lg">전체 스크립트</span><span class="sm">스크립트</span></button>
          <button class="tab" role="tab" id="tab-notes" aria-selected="false"><span class="lg">학습 노트</span><span class="sm">노트</span></button>
        </div>
        <a class="pick scrap-btn" id="scrapLink" href="scrap.html" title="스크랩한 문장" aria-label="스크랩한 문장">☆</a>
      </div>
      <div class="ctrls">
        <button class="follow" id="follow" aria-pressed="true" title="자막 따라가기"><span class="dot"></span><span class="lg">자막 따라가기</span><span class="sm">따라</span></button>
        <button class="toggle" id="toggleKo" aria-pressed="false" title="한국어 가리기"><span class="dot"></span><span class="lg">한국어 가리기</span><span class="sm">한글</span></button>
        <button class="toggle" id="toggleFl" aria-pressed="false" title="군말 흐리게" hidden><span class="dot"></span><span class="lg">군말 흐리게</span><span class="sm">군말</span></button>
      </div>
    </div>
  </div>

  <header class="hero">
    <h1 id="h1"></h1>
    <p class="sub"><span id="desc"></span></p>
    <div class="stats" id="stats"></div>
  </header>

  <main id="script"></main>
  <main id="notes" hidden></main>

  <footer>자막을 문장 단위로 다듬고 군말(uh, um)과 반복은 정리했어요. 비속어는 [bleep]으로 표시.</footer>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <div class="sheet-head"><h2 id="sheetT">영상</h2><button class="sheet-x" id="sheetX">닫기</button></div>
    <input id="vq" type="search" placeholder="제목, 채널로 검색" aria-label="영상 검색" autocomplete="off">
    <div class="chans" id="chans"></div>
    <div class="vlist" id="vlist"></div>
  </div>
</div>

<script src="videos/list.js"></script>
<script src="sync.js"></script>
<script>
/* ---------- which video ---------- */
const VIDEOS=(window.VIDEOS||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")); /* 유튜브 업로드일 최신순 */
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const qv=new URLSearchParams(location.search).get("v");
const META=VIDEOS.find(v=>v.id===qv)||VIDEOS.find(v=>v.id===store.get("sh-last"))||VIDEOS[0];
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const unstar=s=>s.replace(/\*/g,"");
store.set("sh-last",META.id);
/* 주소창엔 ?v=를 남기지 않음 → 홈 화면 아이콘·북마크로 열면 늘 마지막에 본 영상(sh-last)이 뜸 */
if(qv) history.replaceState(null,"",location.pathname+location.hash);
document.title=`${META.ch} ${META.ep} 영어 노트`;
document.getElementById("h1").innerHTML=esc(META.title).replace(/\*(.+?)\*/g,"<em>$1</em>");
document.getElementById("desc").textContent=META.desc||"";
document.getElementById("pickL").textContent=`영상 ${VIDEOS.length}개`;

/* ---------- picker sheet ---------- */
const bg=document.getElementById("sheetBg"), vq=document.getElementById("vq"), vlist=document.getElementById("vlist"), chEl=document.getElementById("chans");
const CH_ORDER=["주아쌤 소리튠영어","헤일리 쌤","카메론","Call Her Daddy","Hey Tablo"];
const grpOf=v=>v.grp||v.ch; /* grp: 여러 채널을 버튼 하나로 묶을 때 (예: Vlog) */
const CH=["전체",...[...new Set(VIDEOS.map(grpOf))].sort((a,b)=>{const i=CH_ORDER.indexOf(a),j=CH_ORDER.indexOf(b);return (i<0?99:i)-(j<0?99:j);})]; let chSel="전체", opener=null;
function updScrapLink(){ const n=Scraps.count(); document.getElementById("scrapLink").innerHTML=n?`★<b>${n}</b>`:"☆"; }
updScrapLink();
function progOf(v){try{return JSON.parse(store.get("sh-prog-"+v.id))}catch(e){return null}}
function renderList(){
  document.getElementById("sheetT").textContent=`영상 ${VIDEOS.length}개`;
  chEl.hidden=CH.length<3;
  chEl.innerHTML=CH.map(c=>`<button data-ch="${esc(c)}" aria-pressed="${c===chSel}">${esc(c)}</button>`).join("");
  const q=vq.value.trim().toLowerCase();
  const L=VIDEOS.filter(v=>(chSel==="전체"||grpOf(v)===chSel)&&(!q||[v.title,v.ch,v.ep,v.tag||"",v.desc||""].join(" ").toLowerCase().includes(q)));
  vlist.innerHTML=L.length?L.map(v=>{const p=progOf(v);
    const ps=p?`<span class="vi-p on">${p.i}/${p.n}</span>`:`<span class="vi-p">새 영상</span>`;
    return `<button class="vi" data-v="${v.id}" aria-current="${v.id===META.id}"><span class="vi-th"><img src="https://i.ytimg.com/vi/${v.yt}/mqdefault.jpg" alt="" loading="lazy"><span>${esc(v.len||"")}</span></span><span><span class="vi-t">${esc(unstar(v.title))}</span><span class="vi-s">${esc(v.ch)} · ${esc(v.ep)}</span></span>${ps}</button>`;}).join("")
    :`<p class="vempty">"${esc(vq.value)}"에 맞는 영상이 없어요.</p>`;
}
function openSheet(e){opener=e.currentTarget;renderList();bg.hidden=false;document.body.classList.add("lock");
  if(matchMedia("(hover:hover)").matches) vq.focus(); else document.getElementById("sheetX").focus();}
function closeSheet(){bg.hidden=true;document.body.classList.remove("lock");if(opener) opener.focus();}
document.getElementById("pick").onclick=openSheet;
document.getElementById("sheetX").onclick=closeSheet;
bg.addEventListener("click",e=>{if(e.target===bg) closeSheet();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!bg.hidden) closeSheet();});
vq.oninput=renderList;
chEl.onclick=e=>{const b=e.target.closest("[data-ch]");if(b){chSel=b.dataset.ch;renderList();}};
vlist.onclick=e=>{const b=e.target.closest("[data-v]");if(!b) return;
  if(b.dataset.v===META.id) closeSheet(); else location.search="?v="+b.dataset.v;};

/* ---------- load this video's data, then build the page ---------- */
(function(){
  const s=document.createElement("script");
  s.src="videos/"+META.id+".js";
  s.onload=()=>init(window.VIDEO);
  s.onerror=()=>{document.getElementById("script").innerHTML=`<p class="sub" style="padding-top:20px">videos/${esc(META.id)}.js 파일을 찾지 못했어요. 파일 이름이 목록의 id와 같은지 확인해 주세요.</p>`;};
  document.head.appendChild(s);
})();

function init({RAW,EXPR=[],ADJ=[],VOCAB=[],TIMES,TIMES2,LABELS,FRAMES=[],STRUCT=[],EXPLAIN=[]}){
const LB=Object.assign({adj:["묘사 단어","영상에 나온 형용사와 부사."],vocab:["어휘","영상에 나온 주요 단어들."]},LABELS);
const VID=META.yt;
const fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};

/* ---------- parse ---------- */
const chapters=[]; const lines=[];
RAW.trim().split("\n").forEach(row=>{
  row=row.trim(); if(!row) return;
  if(row.startsWith("## ")){const [t,k,d]=row.slice(3).split("|");chapters.push({t,k,d,items:[]});return;}
  /* "? 설명" = 바로 위 문장의 쓰임 설명, "> A: EN || KO" = 바로 위 문장의 대화 예문 */
  const last=lines[lines.length-1];
  if(row.startsWith("? ")){last.tip=row.slice(2);return;}
  if(row.startsWith("! ")){last.sit=row.slice(2);return;} /* "! 상황" = 꺼내 말하기 과제 */
  if(row.startsWith("> ")){const m=row.slice(2).match(/^(\w+):\s*(.+?) \|\| (.+)$/);(last.ex=last.ex||[]).push({who:m[1],en:m[2],ko:m[3]});return;}
  const [en,ko]=row.split(" || ");
  const item={n:lines.length+1,en,ko};
  lines.push(item); chapters[chapters.length-1].items.push(item);
});
/* "a / b" = 소리블록(끊어 읽는 단위) 표시. 화면엔 구분선, 음성으로 읽을 땐 제거 */
/* 군말·완충어: 뜻보다 뉘앙스·호흡을 위한 말. "군말 흐리게"를 켜면 연하게 보여 문장 뼈대가 드러남 */
const FILLERS=[/\b(?:um+|uh+|erm)\b,?/gi, /\b(?:like|you know|I mean)(?=,)/gi, /\bI guess\b/gi, /\b(?:basically|literally|actually)\b/gi,
  /(?<!\b(?:what|this|that|a|the|some|any|every|which|one|same|different|these|those|all)\s)\b(?:kind|sort) of\b/gi];
const fillerWrap=s=>FILLERS.reduce((x,re)=>x.replace(re,m=>`<span class="fl">${m}</span>`),s);
/* 말 틀(FRAMES): 문장 뼈대를 세우는 고정 덩어리. 점선 밑줄, 누르면 뜻 */
const FR=FRAMES.map(F=>new RegExp("\\b(?:"+F.re+")","gi"));
const frameWrap=s=>FR.reduce((x,re,i)=>x.replace(re,m=>m.includes("<")?m:`<span class="fr" data-fi="${i}">${m}</span>`),s);
const markup=en=>fillerWrap(frameWrap(esc(en).replace(/\*(.+?)\*/g,"<mark>$1</mark>").replace(/ \/ /g,' <span class="sb">/</span> ')));
/* 구조 해설(STRUCT): 들여쓰기 구조 + 뼈대 + 길을 잃는 지점 + 영어 순서 해석 + 틀 연습 */
const SX=new Map(STRUCT.map(e=>[e.r,e]));
/* 해설 노트(EXPLAIN): 문장에 붙는 자세한 설명. 빈 줄=문단, "1. "=소제목, "(...)"=바로 위 예문의 해석 */
const XP=new Map(EXPLAIN.map(e=>[e.r,e]));
const explainHTML=e=>`<div class="xpt">${esc(e.title)}</div>`+e.body.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>
  /^\d+\.\s/.test(l)?`<h4 class="xph">${esc(l)}</h4>`:/^\(.*\)$/.test(l)?`<p class="xko">${esc(l.slice(1,-1))}</p>`:/^[A-Za-z]/.test(l)?`<p class="xen">${esc(l)}</p>`:`<p>${esc(l)}</p>`).join("");
/* 스크랩: 모든 영상 공통 저장소 (이 기기 브라우저에 저장). 키 = 영상id:문장번호 */
const isScrapped=n=>Scraps.has(META.id+":"+n);
const structHTML=e=>`<div class="sxt">${e.tree.map(([d,t,n])=>`<div class="sxr" style="--d:${d}"><span class="sxe">${esc(t)}</span>${n?`<span class="sxn${n.startsWith("★")?" key":""}">${esc(n)}</span>`:""}</div>`).join("")}</div>`+
  `<dl class="sxd"><dt>뼈대</dt><dd class="sxc">${esc(e.core)}</dd><dt>길을 잃는 지점</dt><dd>${esc(e.trap)}</dd><dt>영어 순서로 해석</dt><dd>${esc(e.order)}</dd><dt>이 틀로 말해 보기</dt><dd class="sxc">${esc(e.prac)}</dd></dl>`;
const plain=en=>en.replace(/\*/g,"").replace(/ \/ /g," ");

/* ---------- script ---------- */
/* 하이라이트 표현이 학습 노트(회화 표현·단어)에 있는 문장 → 스크립트에 "노트 →" 버튼 */
const NOTE_R=new Set([...EXPR,...ADJ,...VOCAB].map(e=>e.r).filter(Boolean));
const S=document.getElementById("script");
let h='<nav class="toc">'+chapters.map((c,i)=>`<a href="#ch${i+1}">${String(i+1).padStart(2,"0")} ${esc(c.k)}</a>`).join("")+'</nav>';
const LOOP_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>';
chapters.forEach((c,i)=>{
  const loopBtn=META.loop?`<button class="ch-loop" data-loop="${i}" aria-pressed="false" aria-label="챕터 ${i+1} 구간 반복">${LOOP_SVG}<span>구간 반복</span></button>`:"";
  h+=`<section class="ch" id="ch${i+1}"><div class="ch-head${META.loop?" has-loop":""}"><span class="ch-num">CHAPTER ${String(i+1).padStart(2,"0")} · #${c.items[0].n}–${c.items[c.items.length-1].n}</span><h2>${esc(c.t)}</h2><p>${esc(c.k)}</p>${c.d?`<p class="ch-d">${esc(c.d)}</p>`:""}${loopBtn}</div>`;
  c.items.forEach(it=>{
    const chip=(sec,label)=>`<a class="t" data-t="${sec}" data-i="${it.n-1}" href="https://youtu.be/${VID}?t=${Math.floor(sec)}" target="_blank" rel="noopener" aria-label="${fmt(sec)}부터 영상 재생">▶ ${label?label+" ":""}${fmt(sec)}</a>`;
    const sLoop=`<button class="s-loop" data-sloop="${it.n-1}" aria-pressed="false" aria-label="${it.n}번 문장 반복" title="이 문장만 반복">${LOOP_SVG}</button>`;
    const scr=isScrapped(it.n), sBtn=`<button class="s-scrap" data-scrap="${it.n}" aria-pressed="${scr}" aria-label="${it.n}번 문장 스크랩" title="스크랩">${scr?"★":"☆"}</button>`;
    const nBtn=NOTE_R.has(it.n)?`<button class="s-note" data-tonote="${it.n}" title="학습 노트의 이 표현으로">노트 →</button>`:"";
    const chips=`<div class="ts">${TIMES2?chip(TIMES[it.n-1],"1회차")+chip(TIMES2[it.n-1],"2회차"):chip(TIMES[it.n-1])}${sLoop}${sBtn}${nBtn}</div>`;
    const tip=(it.tip?`<div class="tip">${esc(it.tip)}</div>`:"")+(it.sit?`<div class="sit"><b>꺼내 말하기</b>${esc(it.sit)}</div>`:"");
    const dlg=it.ex?`<div class="dlg">${it.ex.map(d=>`<div class="dl"><button class="who" data-tts="${esc(plain(d.en))}" aria-label="${esc(d.who)} 대사 듣기">${esc(d.who)}</button><div class="den">${markup(d.en)}</div><div class="dko">${esc(d.ko)}</div></div>`).join("")}</div>`:"";
    const sx=SX.get(it.n), sxBtn=sx?`<button class="sx" data-panel="sxp${it.n}" aria-expanded="false" aria-controls="sxp${it.n}" title="문장 구조 해설">구조</button>`:"";
    const xp=XP.get(it.n), xpBtn=xp?`<button class="sx" data-panel="xpp${it.n}" aria-expanded="false" aria-controls="xpp${it.n}" title="표현 해설">해설</button>`:"";
    const xpPanel=xp?`<div class="sxp sxb xpb" id="xpp${it.n}" hidden>${explainHTML(xp)}</div>`:"";
    const sxPanel=sx?`<div class="sxp sxb" id="sxp${it.n}" hidden>${structHTML(sx)}</div>`:"";
    h+=`<div class="line${sx?" has-sx":""}" id="s${it.n}"><button class="n" data-say="${it.n}" aria-label="${it.n}번 문장 듣기">${it.n}</button>${sx||xp?`<div class="side">${sxBtn}${xpBtn}</div>`:""}<div class="en">${markup(it.en)}</div><div class="ko">${esc(it.ko)}</div>${tip}${dlg}${chips}${sxPanel}${xpPanel}</div>`;
  });
  h+="</section>";
});
S.innerHTML=h;
const refreshStars=()=>{ S.querySelectorAll(".s-scrap").forEach(b=>{const on=isScrapped(+b.dataset.scrap);b.setAttribute("aria-pressed",on);b.textContent=on?"★":"☆";}); updScrapLink(); };
const syncNow=()=>Sync.run().then(ch=>{ if(ch) refreshStars(); });
syncNow(); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") syncNow(); });
{ const m=location.hash.match(/^#s(\d+)$/); if(m){ const el=document.getElementById("s"+m[1]); if(el) setTimeout(()=>{ el.scrollIntoView({block:"center"}); el.classList.add("flash"); },60); } }

/* ---------- notes ---------- */
const N=document.getElementById("notes");
const refBtn=r=>`<button class="ref" data-go="${r}">#${r}</button>`;
let nh="";
if(STRUCT.length){
  nh+=`<section class="notes-sec"><h2>구조 해설 ${STRUCT.length}</h2><p>길고 복잡한 문장을 덩어리로 나눠 들여쓰기로 보여 줘요. ★가 진짜 하고 싶은 말이에요. 본문에서는 번호 아래 '구조' 버튼으로 바로 펼쳐 볼 수 있어요.</p>`;
  STRUCT.slice().sort((a,b)=>a.r-b.r).forEach(e=>{nh+=`<div class="sxi"><div class="ex-src">${markup(lines[e.r-1].en)}${refBtn(e.r)}</div><div class="sxb">${structHTML(e)}</div></div>`;});
  nh+="</section>";
}
const occ=FR.map(re=>lines.filter(l=>{re.lastIndex=0;return re.test(plain(l.en));}).map(l=>l.n));
const usedFr=FRAMES.map((F,i)=>i).filter(i=>occ[i].length); /* 공통 목록 중 이 영상에 나온 틀만 */
if(usedFr.length){
  nh+=`<section class="notes-sec"><h2>말 틀 ${usedFr.length}</h2><p>문장의 뼈대를 세우는 고정 덩어리예요. 한 단어처럼 통째로 외우고, 알맹이만 바꿔 내 문장을 만들어 보세요. 본문에는 점선 밑줄로 표시되고, 누르면 뜻이 떠요.</p><button class="fr-tg" id="frTg" aria-pressed="true">본문 밑줄 표시 중</button>`;
  usedFr.forEach(i=>{const F=FRAMES[i];nh+=`<div class="ex"><div class="ex-top"><span class="ex-p">${esc(F.p)}</span><span class="ex-k">${esc(F.k)}</span></div><div class="ex-tip">${esc(F.t)}</div><div class="ex-src">${markup(lines[occ[i][0]-1].en)}${occ[i].map(refBtn).join("")}</div></div>`;});
  nh+="</section>";
}
nh+=`<section class="notes-sec"><h2>회화 표현 ${EXPR.length}</h2><p>스크립트에서 하이라이트된 표현 중 일상 회화에 바로 쓰기 좋은 것들. 번호를 누르면 원문 위치로 이동해요.</p>`;
EXPR.forEach(e=>{
  const src=lines[e.r-1];
  nh+=`<div class="ex" data-nr="${e.r}"><div class="ex-top"><span class="ex-p">${esc(e.p)}</span><span class="ex-k">${esc(e.k)}</span></div><div class="ex-tip">${esc(e.t)}</div><div class="ex-src">${markup(src.en)}${refBtn(e.r)}</div></div>`;
});
nh+=`</section><section class="notes-sec"><h2>${esc(LB.adj[0])} ${ADJ.length}</h2><p>${esc(LB.adj[1])}</p><div class="words">`;
ADJ.forEach(a=>{nh+=`<div class="w" data-nr="${a.r}"><span class="w-w">${esc(a.w)}</span><span class="w-pos">${a.pos}</span><span class="w-k">${esc(a.k)}${refBtn(a.r)}</span></div>`});
nh+=`</div></section><section class="notes-sec"><h2>${esc(LB.vocab[0])} ${VOCAB.length}</h2><p>${esc(LB.vocab[1])}</p><div class="words">`;
VOCAB.forEach(a=>{nh+=`<div class="w" data-nr="${a.r}"><span class="w-w">${esc(a.w)}</span><span class="w-pos">${a.pos}</span><span class="w-k">${esc(a.k)}${refBtn(a.r)}</span></div>`});
nh+="</div></section>";
N.innerHTML=nh;
/* 노트 섹션 바로가기 알약 (스크립트의 챕터 알약과 같은 모양) */
const nsecs=[...N.querySelectorAll(".notes-sec")];
nsecs.forEach((s,i)=>s.id="ns"+(i+1));
if(nsecs.length>1) N.insertAdjacentHTML("afterbegin",'<nav class="toc">'+nsecs.map((s,i)=>`<a href="#ns${i+1}">${esc(s.querySelector("h2").textContent)}</a>`).join("")+'</nav>');

const marks=lines.reduce((a,l)=>a+(l.en.match(/\*/g)||[]).length/2,0);
const noteCount=EXPR.length+ADJ.length+VOCAB.length+STRUCT.length+usedFr.length, exCount=lines.reduce((a,l)=>a+(l.ex?1:0),0);
document.getElementById("stats").innerHTML=`<span><b>${lines.length}</b> ${exCount?"표현":"문장"}</span><span><b>${chapters.length}</b> 챕터</span>`+
  (exCount?`<span><b>${exCount}</b> 대화 예문</span>`:"")+(marks?`<span><b>${marks}</b> 하이라이트</span>`:"")+(noteCount?`<span><b>${noteCount}</b> 노트 항목</span>`:"");
/* 노트가 없는 영상은 탭 없이 스크립트만 */
document.querySelector(".tabs").hidden=!noteCount;

/* ---------- tabs / toggle ---------- */
const tS=document.getElementById("tab-script"), tN=document.getElementById("tab-notes");
function show(which){
  const isS=which==="script";
  S.hidden=!isS; N.hidden=isS;
  tS.setAttribute("aria-selected",isS); tN.setAttribute("aria-selected",!isS);
  store.set("sh-tab",which);
}
tS.onclick=()=>show("script"); tN.onclick=()=>show("notes");
const tg=document.getElementById("toggleKo");
function setHide(v){document.body.classList.toggle("hide-ko",v);tg.setAttribute("aria-pressed",v);store.set("sh-hide",v?"1":"0")}
tg.onclick=()=>setHide(!document.body.classList.contains("hide-ko"));
if((store.get("sh-hide")??store.get("ht40-hide"))==="1") setHide(true);
const tf=document.getElementById("toggleFl");
function setFade(v){document.body.classList.toggle("fade-fl",v);tf.setAttribute("aria-pressed",v);store.set("sh-fade",v?"1":"0")}
tf.onclick=()=>setFade(!document.body.classList.contains("fade-fl"));
tf.hidden=!S.querySelector(".fl"); /* 군말이 없는 영상(교안 영상 등)에선 버튼 숨김 */
if(!tf.hidden&&store.get("sh-fade")==="1") setFade(true);
if(noteCount&&(store.get("sh-tab")??store.get("ht40-tab"))==="notes") show("notes");

/* ---------- video ---------- */
let player=null, ready=false, cur=-1, follow=true;
const dock=document.getElementById("dock"), fb=document.getElementById("follow");
/* 노트의 목록 알약이 영상·버튼 영역 바로 아래에 붙어 있도록 그 높이를 CSS에 알려 줌 */
const setDockH=()=>document.documentElement.style.setProperty("--dock-h",dock.offsetHeight+"px");
setDockH(); if(window.ResizeObserver) new ResizeObserver(setDockH).observe(dock); else addEventListener("resize",setDockH);
fb.onclick=()=>{follow=!follow;fb.setAttribute("aria-pressed",follow)};
/* 이어 보기: 영상별 마지막 재생 위치를 기억했다가 다음에 열면 그 지점에서 시작 */
const POS_KEY="sh-pos-"+META.id, resumeAt=+(store.get(POS_KEY)||0);
let lastSaved=resumeAt;
window.onYouTubeIframeAPIReady=()=>{
  player=new YT.Player("yt",{videoId:VID,playerVars:{playsinline:1,rel:0,modestbranding:1,start:resumeAt>5?Math.floor(resumeAt):0},
    events:{onStateChange:e=>{
        if(e.data===0&&LOOP){ player.seekTo(loopRange()[0],true); player.playVideo(); return; }
        if(e.data===0) store.set(POS_KEY,"0"); /* 끝까지 봤으면 다음엔 처음부터 */
        if(e.data===2) store.set(POS_KEY,String(Math.floor(player.getCurrentTime()))); /* 일시정지할 때도 저장 */
      },
      onReady:()=>{ready=true;dock.classList.add("has-player");document.body.classList.add("yt-ready");
        if(resumeAt>5){ let i=-1; for(const [s,k] of CUES){ if(s<=resumeAt+0.3) i=k; else break; } if(i>=0) markNow(i); } }}});
};
(function(){
  const s=document.createElement("script");
  s.src="https://www.youtube.com/iframe_api"; s.async=true;
  s.onerror=()=>{}; /* 영상 삽입이 막힌 환경에선 새 탭 링크로 동작 */
  document.head.appendChild(s);
})();
function markNow(i){
  if(i===cur) return;
  const prev=document.querySelector(".line.now"); if(prev) prev.classList.remove("now");
  cur=i; if(i<0) return;
  const el=document.getElementById("s"+(i+1)); el.classList.add("now");
  const p=progOf(META); if(!p||i+1>p.i) store.set("sh-prog-"+META.id,JSON.stringify({i:i+1,n:lines.length}));
  if(follow&&!S.hidden){
    const r=el.getBoundingClientRect(), top=dock.getBoundingClientRect().bottom;
    if(r.top<top+8||r.bottom>innerHeight-20) window.scrollBy({top:r.top-top-innerHeight*0.12,behavior:"smooth"});
  }
}
setInterval(()=>{
  if(!ready||!player.getPlayerState||player.getPlayerState()!==1) return;
  const t=player.getCurrentTime()+0.3; let i=-1;
  if(Math.abs(t-lastSaved)>=3){ lastSaved=t; store.set(POS_KEY,String(Math.floor(t))); } /* 재생 위치 저장 */
  if(LOOP){ const [a,b]=loopRange(); if(t-0.3>=b){ player.seekTo(a,true); return; } }
  for(const [s,k] of CUES){ if(s<=t) i=k; else break; }
  if(LOOP&&LOOP.kind==="s") i=LOOP.idx; /* 문장 반복 중엔 그 문장만 하이라이트 */
  markNow(i);
},400);
/* ---------- 구간 반복: 챕터(ch) 또는 한 문장(s) ---------- */
let LOOP=null; /* {kind:"ch"|"s", idx} */
/* [시작, 끝] 초
   챕터: 첫 문장 0.5초 전 ~ 다음 챕터 첫 문장 (마지막 챕터는 영상 끝까지)
   문장: 0.3초 전 ~ 다음 문장 시작. 다음 문장까지 음악 등으로 너무 멀면 문장 길이로 어림잡아 자름 */
function loopRange(){
  if(LOOP.kind==="ch"){
    const ci=LOOP.idx, a=Math.max(0,TIMES[chapters[ci].items[0].n-1]-0.5);
    const nx=chapters[ci+1], b=nx?TIMES[nx.items[0].n-1]:(player.getDuration()||1e9);
    return [a,b];
  }
  const i=LOOP.idx, a=Math.max(0,TIMES[i]-0.3);
  const words=plain(lines[i].en).split(/\s+/).length, cap=a+Math.max(5,words*0.55+3);
  const nx=TIMES[i+1]!=null&&TIMES[i+1]>TIMES[i]?TIMES[i+1]:(player.getDuration()||cap);
  return [a,Math.min(nx,cap)];
}
function setLoop(kind,idx){
  LOOP=kind==null?null:{kind,idx};
  document.querySelectorAll(".ch-loop").forEach(b=>{const on=!!LOOP&&LOOP.kind==="ch"&&+b.dataset.loop===idx;b.setAttribute("aria-pressed",on);b.querySelector("span").textContent=on?"반복 중":"구간 반복";});
  document.querySelectorAll(".s-loop").forEach(b=>b.setAttribute("aria-pressed",!!LOOP&&LOOP.kind==="s"&&+b.dataset.sloop===idx));
}
function startLoop(kind,idx){
  if(LOOP&&LOOP.kind===kind&&LOOP.idx===idx){ setLoop(null); return; } /* 같은 버튼 다시 누르면 해제 */
  setLoop(kind,idx); player.seekTo(loopRange()[0],true); player.playVideo();
  markNow(kind==="ch"?chapters[idx].items[0].n-1:idx);
}
/* 시간순 [초, 문장 인덱스] — 2회차가 있으면 두 회차 모두 따라감 */
const CUES=[...TIMES.map((s,k)=>[s,k]),...(TIMES2||[]).map((s,k)=>[s,k])].sort((a,b)=>a[0]-b[0]);

/* 말 틀 뜻 말풍선 */
const tipEl=document.createElement("div"); tipEl.className="fr-tip"; tipEl.hidden=true; document.body.appendChild(tipEl);
const hideTip=()=>{tipEl.hidden=true};
let tipY=0; /* 조금 스크롤된 정도로는 닫지 않음 (자막 따라가기 자동 스크롤 등) */
addEventListener("scroll",()=>{ if(!tipEl.hidden&&Math.abs(scrollY-tipY)>60) hideTip(); },{passive:true});
function showTip(el){
  tipY=scrollY;
  const F=FRAMES[+el.dataset.fi]; tipEl.innerHTML=`<b>말 틀 · ${esc(F.p)}</b>${esc(F.k)}<span>${esc(F.t)}</span>`; tipEl.hidden=false;
  const r=el.getBoundingClientRect(), w=tipEl.offsetWidth, h=tipEl.offsetHeight;
  tipEl.style.left=Math.max(12,Math.min(r.left,innerWidth-w-12))+"px";
  tipEl.style.top=(r.bottom+8+h>innerHeight?r.top-h-8:r.bottom+8)+"px";
}
const frTg=document.getElementById("frTg");
function setFr(v){document.body.classList.toggle("no-fr",!v);if(frTg){frTg.setAttribute("aria-pressed",v);frTg.textContent=v?"본문 밑줄 표시 중":"본문 밑줄 꺼짐";}store.set("sh-fr",v?"1":"0")}
if(frTg){frTg.onclick=()=>setFr(document.body.classList.contains("no-fr")); if(store.get("sh-fr")==="0") setFr(false);}

document.addEventListener("click",e=>{
  const toc=e.target.closest(".toc a");
  if(toc){ e.preventDefault(); const t=document.querySelector(toc.getAttribute("href")); /* 위쪽 영상·버튼 영역에 가리지 않게 그 아래로 */
    if(t){ const st=toc.closest("#notes")?toc.parentElement.offsetHeight:0, y=t.getBoundingClientRect().top+scrollY-dock.offsetHeight-st-6; window.scrollTo({top:y,behavior:Math.abs(y-scrollY)>2500?"auto":"smooth"}); } return; } /* 먼 거리는 바로 이동 */
  const fr=e.target.closest(".fr");
  if(fr&&!document.body.classList.contains("no-fr")){ showTip(fr); return; }
  if(!tipEl.hidden&&!e.target.closest(".fr-tip")) hideTip();
  const sxb=e.target.closest(".sx");
  if(sxb){ const p=document.getElementById(sxb.dataset.panel), open=p.hidden; p.hidden=!open; sxb.setAttribute("aria-expanded",open); return; }
  const sc=e.target.closest(".s-scrap");
  if(sc){ const n=+sc.dataset.scrap, k=META.id+":"+n;
    if(Scraps.has(k)) Scraps.remove(k); else { const ln=lines[n-1]; Scraps.put(k,{id:META.id,n,en:ln.en,ko:ln.ko,t:TIMES[n-1],at:Date.now(),memo:""}); }
    const on=Scraps.has(k); sc.setAttribute("aria-pressed",on); sc.textContent=on?"★":"☆"; updScrapLink(); return; }
  const tc=e.target.closest(".t");
  if(tc&&ready){ e.preventDefault(); const sec=+tc.dataset.t;
    if(LOOP){ const [a,b]=loopRange(); if(sec<a||sec>=b) setLoop(null); } /* 반복 구간 밖을 누르면 반복 해제 */
    player.seekTo(sec,true); player.playVideo();
    markNow(+tc.dataset.i); return; }
  const lb=e.target.closest(".ch-loop");
  if(lb&&ready){ startLoop("ch",+lb.dataset.loop); return; }
  const sl=e.target.closest(".s-loop");
  if(sl&&ready){ startLoop("s",+sl.dataset.sloop); return; }
  const tts=e.target.closest("[data-tts]");
  if(tts&&"speechSynthesis" in window){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(tts.dataset.tts); u.lang="en-US"; u.rate=.95; speechSynthesis.speak(u); return; }
  const ko=e.target.closest(".ko,.dko"); if(ko&&document.body.classList.contains("hide-ko")) ko.classList.toggle("peek");
  const tn=e.target.closest("[data-tonote]");
  if(tn){ const el=N.querySelector(`[data-nr="${tn.dataset.tonote}"]`); if(el){ show("notes"); const bar=N.querySelector(".toc"), y=el.getBoundingClientRect().top+scrollY-dock.offsetHeight-(bar?bar.offsetHeight:0)-10;
    window.scrollTo({top:y,behavior:"auto"});
    const fix=()=>{ const lim=bar?bar.getBoundingClientRect().bottom:dock.getBoundingClientRect().bottom, d=el.getBoundingClientRect().top-lim-10; if(Math.abs(d)>2) window.scrollBy(0,d); }; fix(); setTimeout(fix,80); /* 고정된 목록 줄 바로 아래로 맞춤 */
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } return; }
  const go=e.target.closest("[data-go]");
  if(go){show("script");const el=document.getElementById("s"+go.dataset.go);el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}
  const say=e.target.closest("[data-say]");
  if(say&&"speechSynthesis" in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(plain(lines[say.dataset.say-1].en).replace(/\[bleep\]/g,""));
    u.lang="en-US"; u.rate=.95; speechSynthesis.speak(u);
  }
});
}
</script>
